            <form class="d-flex mt-3" role="Buscar">
              <input
                class="form-control me-2"
                type="Buscar"
                placeholder="Buscar"
                aria-label="Buscar"
              />
              <button class="btn btn-outline-success" type="submit">
                Buscador
              </button>
            </form>
          </div>
        </div>
      </div>

    <!--Pedidos-->
    <div class="formulario">
      <form class="row g-3">
        <div class="col-md-6">
          <label for="inputEmail4" class="form-label">Email</label>
          <input type="email" class="form-control" id="inputEmail4" />
        </div>
        <div class="col-md-6">
          <label for="inputPassword4" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="inputPassword4" />
        </div>
        <div class="col-12">
          <label for="inputAddress" class="form-label">Dirección</label>
          <input
            type="text"
            class="form-control"
            id="inputAddress"
            placeholder="ejemplo- casa 12 calle 4"
          />
        </div>
        <div class="col-12">
          <label for="inputAddress2" class="form-label">Dirección 2</label>
          <input
            type="text"
            class="form-control"
            id="inputAddress2"
            placeholder="Apartamento, estudio, o otro"
          />
        </div>
        <div class="col-md-6">
          <label for="inputCity" class="form-label">Ciudad</label>
          <input type="text" class="form-control" id="inputCity" />
        </div>
        <div class="col-md-4">
          <label for="inputState" class="form-label">Estado o municipalidad</label>
          <select id="inputState" class="form-select">
            <option selected>Más opciones...</option>
            <option>Guatemala  Ciudad de Guatemala
                  </option>
          </select>
        </div>
        <div class="col-md-2">
          <label for="inputZip" class="form-label"></label>
          <input type="text" class="form-control" id="inputZip" />
        </div>
        <div class="col-12">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="gridCheck" />
            <label class="form-check-label" for="gridCheck"> ¡Confirma ya! </label>
          </div>
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">Confirmar</button>
        </div>
      </form>
    </div>
<!--final de pedidos-->

    ></script>
